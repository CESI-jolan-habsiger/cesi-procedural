name: Html Validator

on:
  pull_request:
    branches:
      - develop

jobs:
    html-validator:
        runs-on: ubuntu-latest
        name: Html Validator
        steps:
        - uses: actions/checkout@v4

        - name: Html Validator
          uses: Cyb3r-Jak3/html5validator-action@v7.2.0
          with:
            root: /
